import os

config.substitutions = list(config.substitutions)
config.substitutions.insert(0, ("%contracts_test", "%clang_cc1 -fcontracts -std=c++26 %s"))
config.substitutions.insert(0, ("%contracts_verify_test", "%contracts_test -verify"))

# Tests that compile against or link with the libc++ and contracts runtime
# built alongside this compiler use %libcxx_flags and say
# `REQUIRES: contracts-libcxx`; the feature is present only when both were
# actually built.  Those that also run what they built require `native` too,
# as everything under Runnable/ does (Runnable/lit.local.cfg).
_triple = getattr(config, "target_triple", "") or "x86_64-unknown-linux-gnu"
_libcxx_libdir = os.path.join(config.llvm_obj_root, "lib", _triple)
_libcxx_flags = "-stdlib=libc++ -L{0} -Wl,-rpath,{0}".format(_libcxx_libdir)
config.substitutions.insert(0, ("%libcxx_flags", _libcxx_flags))
config.substitutions.insert(0, ("%libcxx_libdir", _libcxx_libdir))

if all(
    os.path.exists(os.path.join(_libcxx_libdir, lib))
    for lib in ("libc++.so", "libcontracts.so")
):
    config.available_features.add("contracts-libcxx")

# The std and std.compat module sources libc++ generates into the build tree
# (LIBCXX_GENERATED_MODULE_DIR), for tests that build `import std;` themselves.
_libcxx_moduledir = os.path.join(config.llvm_obj_root, "modules", "c++", "v1")
config.substitutions.insert(0, ("%libcxx_moduledir", _libcxx_moduledir))
if os.path.exists(os.path.join(_libcxx_moduledir, "std.cppm")):
    config.available_features.add("libcxx-std-module")
