import os

config.substitutions = list(config.substitutions)
config.substitutions.insert(0, ("%contracts_test", "%clang_cc1 -fcontracts -std=c++26 -fcolor-diagnostics %s"))
config.substitutions.insert(0, ("%contracts_verify_test", "%contracts_test -verify"))

_libcxx_libdir = os.path.join(config.llvm_obj_root, "lib", "x86_64-unknown-linux-gnu")
_libcxx_flags = "-stdlib=libc++ -Wno-gcc-install-dir-libstdcxx -L{0} -Wl,-rpath,{0}".format(_libcxx_libdir)
config.substitutions.insert(0, ("%libcxx_flags", _libcxx_flags))

